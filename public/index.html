<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de libros</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.5rem; }
    form { display: grid; gap: .75rem; background: #f4f6f8; padding: 1rem; border-radius: 10px; }
    label { display: grid; gap: .25rem; font-size: .9rem; }
    input { padding: .5rem; border: 1px solid #bbb; border-radius: 6px; font-size: 1rem; }
    button { padding: .6rem; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; }
    #msg { margin: .75rem 0; min-height: 1.2rem; font-size: .95rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #ddd; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>📚 Registro de libros de la biblioteca</h1>

  <form id="form">
    <label>Título <input name="titulo" required></label>
    <label>Autor <input name="autor" required></label>
    <label>ISBN <input name="isbn"></label>
    <label>Año de publicación <input name="anio" type="number" min="0" max="2100"></label>
    <button type="submit">Guardar libro</button>
  </form>

  <div id="msg"></div>

  <h2>Libros guardados</h2>
  <table>
    <thead><tr><th>Título</th><th>Autor</th><th>ISBN</th><th>Año</th></tr></thead>
    <tbody id="lista"></tbody>
  </table>

  <script>
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const lista = document.getElementById('lista');

    async function cargar() {
      const res = await fetch('/api/libros');
      const libros = await res.json();
      lista.innerHTML = '';
      libros.forEach(l => {
        const tr = document.createElement('tr');
        [l.titulo, l.autor, l.isbn || '', l.anio || ''].forEach(v => {
          const td = document.createElement('td');
          td.textContent = v;
          tr.appendChild(td);
        });
        lista.appendChild(tr);
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const datos = Object.fromEntries(new FormData(form));
      if (!datos.anio) delete datos.anio;
      const res = await fetch('/api/libros', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos)
      });
      if (res.ok) {
        msg.textContent = '✅ Libro guardado en la base de datos';
        form.reset();
        cargar();
      } else {
        const err = await res.json();
        msg.textContent = '❌ ' + err.error;
      }
    });

    cargar();
  </script>
</body>
</html>
