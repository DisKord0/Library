<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca</title>
  <style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: #f3e6d0; overflow-x: hidden;
  font-family: Georgia, 'Times New Roman', serif;
  background: radial-gradient(ellipse at top, #5a3a22 0%, #2e1b0e 70%) fixed;
}
/* luz de lámpara que respira */
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(circle at 50% 0%, #ffcf7a55, transparent 55%);
  animation: lampara 6s ease-in-out infinite;
}
@keyframes lampara { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

/* motas de polvo flotando */
#polvo { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
#polvo span {
  position: absolute; bottom: -10px; border-radius: 50%; background: #ffe6b0;
  opacity: 0; animation: flotar linear infinite;
}
@keyframes flotar {
  0% { transform: translate(0, 0); opacity: 0; }
  15% { opacity: .5; }
  85% { opacity: .4; }
  100% { transform: translate(40px, -105vh); opacity: 0; }
}

header, main { position: relative; z-index: 1; }
header { text-align: center; padding: 1.5rem 1rem .5rem; animation: bajar .8s ease-out backwards; }
header h1 { margin: 0; font-size: 2.2rem; letter-spacing: .08em; }
.icono { display: inline-block; animation: rebote 2.4s ease-in-out infinite; }
@keyframes rebote { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-6px) rotate(-8deg); } }
.titulo {
  background: linear-gradient(90deg, #f0c674, #fff3c4, #f0c674);
  background-size: 200% 100%; -webkit-background-clip: text; background-clip: text;
  color: transparent; animation: brillo 4s linear infinite;
}
@keyframes brillo { to { background-position: -200% 0; } }
header p { margin: .25rem 0 .5rem; font-style: italic; color: #d9c3a0; }
.contador {
  display: inline-block; padding: .3rem .9rem; border-radius: 999px;
  background: #0006; border: 1px solid #f0c67455; color: #f0c674; font-size: .9rem;
}
@keyframes bajar { from { opacity: 0; transform: translateY(-30px); } }
@keyframes subirSuave { from { opacity: 0; transform: translateY(30px); } }

main { max-width: 960px; margin: 0 auto; padding: 1rem; display: grid; gap: 1.5rem; }

/* Ficha de registro */
.ficha {
  background: #f6ecd6; color: #3a2a18; border-radius: 6px; padding: 1rem 1.25rem;
  box-shadow: 0 6px 16px #0008; border-top: 6px solid #b5452f;
  animation: subirSuave .8s .15s ease-out backwards;
}
.ficha h2 { margin: 0 0 .75rem; font-size: 1.15rem; }
form { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
label { display: grid; gap: .2rem; font-size: .85rem; }
input {
  padding: .5rem; border: 0; border-bottom: 2px solid #8a6a3f; background: #fffaf0;
  font: inherit; color: inherit; border-radius: 3px 3px 0 0; transition: box-shadow .2s, border-color .2s;
}
input:focus { outline: none; border-color: #b5452f; box-shadow: 0 4px 10px #b5452f44; }
button#guardar {
  grid-column: 1 / -1; padding: .7rem; border: 0; border-radius: 6px; cursor: pointer; position: relative; overflow: hidden;
  background: #7b2d26; color: #fff3dc; font: inherit; font-size: 1rem; letter-spacing: .04em;
  transition: transform .15s, background .2s;
}
button#guardar::after {
  content: ''; position: absolute; top: 0; left: -80%; width: 50%; height: 100%;
  background: linear-gradient(100deg, transparent, #fff5, transparent); transform: skewX(-20deg);
}
button#guardar:hover { background: #962f25; transform: translateY(-2px); }
button#guardar:hover::after { animation: barrido .7s; }
button#guardar:active { transform: scale(.97); }
button#guardar:disabled { opacity: .8; cursor: wait; }
button#guardar.cargando::before {
  content: ''; display: inline-block; width: 1em; height: 1em; margin-right: .5em; vertical-align: -.15em;
  border: 2px solid #fff8; border-top-color: #fff; border-radius: 50%; animation: giro .7s linear infinite;
}
@keyframes barrido { to { left: 130%; } }
@keyframes giro { to { transform: rotate(360deg); } }
#msg { min-height: 1.3rem; margin: .5rem 0 0; font-size: .9rem; }
#msg.pop { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes pop { from { transform: scale(.7); opacity: 0; } }
@media (max-width: 560px) { form { grid-template-columns: 1fr; } }

/* Estantería */
.librero {
  background: #3a2312; padding: 1rem 1rem .5rem; border-radius: 8px;
  border: 10px solid #6b4423; box-shadow: inset 0 0 25px #000a, 0 8px 18px #000a;
  animation: subirSuave .8s .3s ease-out backwards;
}
.estante { margin-bottom: .75rem; }
.libros { display: flex; align-items: flex-end; gap: 3px; min-height: 185px; padding: 0 .5rem; }
.tabla { height: 16px; border-radius: 2px; background: linear-gradient(#a8743f, #6b4423); box-shadow: 0 6px 8px #0009; }

.libro {
  border: 0; padding: 8px 2px; cursor: pointer; flex: none; position: relative;
  border-radius: 3px 3px 0 0; color: #fff3dc; font-family: inherit; font-size: .8rem;
  writing-mode: vertical-rl; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  box-shadow: inset -3px 0 0 #0004, inset 3px 0 0 #fff2, 2px 0 4px #0008;
  border-top: 3px solid #f0c67466; transform-origin: bottom center;
  transition: transform .25s cubic-bezier(.3, 1.5, .5, 1), box-shadow .25s;
}
.libro::after { /* franja dorada del lomo */
  content: ''; position: absolute; left: 0; right: 0; bottom: 14px; height: 3px;
  background: #f0c67488; box-shadow: 0 -6px 0 #f0c67455;
}
.libro:hover { transform: translateY(-10px) rotate(-3deg); box-shadow: inset -3px 0 0 #0004, inset 3px 0 0 #fff2, 0 10px 12px #000a; }
.libro.activo {
  transform: translateY(-20px) scale(1.05); z-index: 2;
  box-shadow: inset -3px 0 0 #0004, inset 3px 0 0 #fff2, 0 0 18px #f0c674aa, 0 12px 14px #000a;
}
.libro.entra { animation: subirLibro .55s var(--d, 0ms) cubic-bezier(.2, 1.3, .4, 1) backwards; }
.libro.nuevo { animation: caer 1s cubic-bezier(.3, 1.2, .5, 1) backwards; }
@keyframes subirLibro { from { transform: translateY(60px); opacity: 0; } }
@keyframes caer {
  0% { transform: translateY(-260px) rotate(-25deg); opacity: 0; }
  55% { opacity: 1; }
  70% { transform: translateY(10px) rotate(3deg); }
  85% { transform: translateY(-6px) rotate(-1deg); }
  100% { transform: translateY(0) rotate(0); }
}
.vacio { text-align: center; color: #d9c3a0; font-style: italic; padding: 1rem 0; animation: latir 1.6s ease-in-out infinite; }
@keyframes latir { 50% { opacity: .5; } }

/* Ficha del libro: se abre como un libro */
#detalle { min-height: 60px; perspective: 1000px; }
.detalle-card {
  position: relative; background: #f6ecd6; color: #3a2a18; border-radius: 6px; padding: 1rem 1.25rem;
  box-shadow: 0 6px 16px #0008; border-left: 12px solid var(--c, #7b2d26);
  transform-origin: left center; animation: abrir .6s cubic-bezier(.2, .9, .3, 1) backwards;
}
.detalle-card::after { /* separador de lectura */
  content: ''; position: absolute; top: -6px; right: 22px; width: 18px; height: 46px;
  background: #b5452f; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
  animation: colgar .8s .3s ease-out backwards;
}
.detalle-card h3 { margin: 0 0 .25rem; font-size: 1.3rem; }
.detalle-card p { margin: .15rem 0; font-size: .95rem; }
@keyframes abrir { from { transform: rotateY(-80deg); opacity: 0; } }
@keyframes colgar { from { height: 0; } }
.hint { text-align: center; color: #d9c3a0; font-style: italic; font-size: .9rem; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
  <div id="polvo" aria-hidden="true"></div>

  <header>
    <h1><span class="icono">📚</span> <span class="titulo">Biblioteca</span></h1>
    <p>Cada libro que registras se guarda en la base de datos y aparece en el estante</p>
    <div class="contador" id="contador">📖 0 libros en la biblioteca</div>
  </header>

  <main>
    <section class="ficha">
      <h2>Ficha de registro</h2>
      <form id="form">
        <label>Título <input name="titulo" required></label>
        <label>Autor <input name="autor" required></label>
        <label>ISBN <input name="isbn"></label>
        <label>Año de publicación <input name="anio" type="number" min="0" max="2100"></label>
        <button type="submit" id="guardar">Guardar libro en el estante</button>
      </form>
      <div id="msg"></div>
    </section>

    <section>
      <div class="librero" id="librero"></div>
    </section>

    <section id="detalle"><p class="hint">Haz clic en un libro para sacarlo del estante y ver su ficha.</p></section>
  </main>

  <script>
const COLORES = ['#7b2d26', '#2d5a4a', '#1f3a5f', '#8a5a2b', '#5b3a6b', '#a23b3b', '#3b5d2f', '#9a6b1c'];
const $ = (id) => document.getElementById(id);
const form = $('form'), msg = $('msg'), librero = $('librero');
const detalle = $('detalle'), contador = $('contador'), boton = $('guardar');

let libros = [];
let nuevoId = null;
let activoId = null;
let animar = true; // solo la primera carga anima todos los libros
let mostrado = 0;
const botones = new Map();

// Motas de polvo de fondo
(function polvo() {
  const cont = $('polvo');
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('span');
    const t = 2 + Math.random() * 3;
    s.style.left = Math.random() * 100 + '%';
    s.style.width = s.style.height = t + 'px';
    s.style.animationDuration = 14 + Math.random() * 14 + 's';
    s.style.animationDelay = -Math.random() * 20 + 's';
    cont.appendChild(s);
  }
})();

function hash(texto) {
  let h = 0;
  for (const c of texto) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return h;
}

function animarContador(destino) {
  const inicio = mostrado, t0 = performance.now(), dur = 700;
  function paso(t) {
    const p = Math.min(1, (t - t0) / dur);
    const n = Math.round(inicio + (destino - inicio) * p);
    contador.textContent = '📖 ' + n + (n === 1 ? ' libro' : ' libros') + ' en la biblioteca';
    if (p < 1) requestAnimationFrame(paso); else mostrado = destino;
  }
  requestAnimationFrame(paso);
}

function crearLibro(l, i) {
  const h = hash(l.titulo + l.autor);
  const color = COLORES[h % COLORES.length];
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'libro' + (animar ? ' entra' : '') + (l._id === nuevoId ? ' nuevo' : '') + (l._id === activoId ? ' activo' : '');
  btn.style.setProperty('--d', i * 45 + 'ms');
  btn.style.background = color;
  btn.style.height = 120 + (h % 55) + 'px';
  btn.style.width = 34 + (h % 5) * 6 + 'px';
  btn.title = l.titulo;
  btn.textContent = l.titulo;
  btn.addEventListener('click', () => mostrarDetalle(l, color));
  botones.set(l._id, btn);
  return btn;
}

function mostrarDetalle(l, color) {
  activoId = l._id;
  botones.forEach((b, id) => b.classList.toggle('activo', id === activoId));
  detalle.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'detalle-card';
  card.style.setProperty('--c', color);
  const linea = (texto, tag) => {
    const el = document.createElement(tag || 'p');
    el.textContent = texto;
    card.appendChild(el);
  };
  linea(l.titulo, 'h3');
  linea('Autor: ' + l.autor);
  if (l.isbn) linea('ISBN: ' + l.isbn);
  if (l.anio) linea('Año: ' + l.anio);
  linea('Registrado: ' + new Date(l.fechaRegistro).toLocaleString('es-MX'));
  detalle.appendChild(card);
  detalle.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function render() {
  librero.innerHTML = '';
  botones.clear();
  const porEstante = Math.max(4, Math.floor((librero.clientWidth - 60) / 46));
  const estantes = Math.max(2, Math.ceil(libros.length / porEstante));
  let idx = 0;
  for (let i = 0; i < estantes; i++) {
    const est = document.createElement('div');
    est.className = 'estante';
    const fila = document.createElement('div');
    fila.className = 'libros';
    libros.slice(i * porEstante, (i + 1) * porEstante).forEach((l) => fila.appendChild(crearLibro(l, idx++)));
    const tabla = document.createElement('div');
    tabla.className = 'tabla';
    est.appendChild(fila);
    est.appendChild(tabla);
    librero.appendChild(est);
  }
  if (!libros.length) {
    const v = document.createElement('p');
    v.className = 'vacio';
    v.textContent = 'El estante está vacío. Registra tu primer libro.';
    librero.appendChild(v);
  }
  animar = false;
  nuevoId = null;
}

async function cargar() {
  try {
    const res = await fetch('/api/libros');
    if (!res.ok) throw new Error('fallo');
    libros = await res.json();
    render();
    animarContador(libros.length);
  } catch (e) {
    librero.innerHTML = '';
    const v = document.createElement('p');
    v.className = 'vacio';
    v.textContent = 'Despertando la biblioteca… un momento';
    librero.appendChild(v);
    setTimeout(cargar, 4000);
  }
}

function avisar(texto) {
  msg.textContent = texto;
  msg.className = '';
  void msg.offsetWidth; // reinicia la animación
  msg.className = 'pop';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const datos = Object.fromEntries(new FormData(form));
  if (!datos.anio) delete datos.anio;
  boton.disabled = true;
  boton.classList.add('cargando');
  boton.textContent = 'Guardando…';
  try {
    const res = await fetch('/api/libros', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(datos)
    });
    if (res.ok) {
      const guardado = await res.json();
      nuevoId = guardado._id;
      avisar('✅ Libro guardado en la base de datos y colocado en el estante');
      form.reset();
      libros.unshift(guardado);
      render();
      animarContador(libros.length);
    } else {
      const err = await res.json();
      avisar('❌ ' + err.error);
    }
  } catch (e) {
    avisar('❌ No se pudo conectar con el servidor');
  } finally {
    boton.disabled = false;
    boton.classList.remove('cargando');
    boton.textContent = 'Guardar libro en el estante';
  }
});

let t;
window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(render, 150); });
cargar();
</script>
</body>
</html>
